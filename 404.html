<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4A7C6F">
<meta name="robots" content="noindex, nofollow">
<title>Temporarily unavailable | TanyaMuch Wellness</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#4A7C6F;--green-d:#3a6358;--bg:#f6f4ef;--ink:#2b3a36;--muted:#6b7a75}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 10%,#e4eee9 0,transparent 45%),var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);text-align:center}
.card{max-width:520px;width:100%;background:#fff;border-radius:20px;padding:48px 32px;box-shadow:0 10px 40px rgba(74,124,111,.12)}
.logo{width:64px;height:64px;margin:0 auto 20px;display:block}
.brand{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:24px}
.code{font-family:'Playfair Display',serif;font-size:4.5rem;color:var(--green);line-height:1;opacity:.9}
h1{font-family:'Playfair Display',serif;font-weight:500;font-size:1.9rem;margin:12px 0 14px}
p{color:var(--muted);line-height:1.7;font-weight:300;margin-bottom:28px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;padding:13px 26px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-weight:500;font-size:.95rem;transition:background .2s}
a.btn:hover{background:var(--green-d)}
a.btn.alt{background:transparent;color:var(--green);border:1.5px solid var(--green)}
a.btn.alt:hover{background:#eef4f1}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="/favicon_128x128.png" alt="" onerror="this.style.display='none'">
<div class="brand">TanyaMuch Wellness</div>
<h1>Website temporarily unavailable</h1>
<p>This website is currently offline. Please check back soon.</p>
</main>
</body>
</html>
